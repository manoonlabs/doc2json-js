name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Smoke test the build
        run: |
          node -e "const { Doc2Json } = require('./dist/index.cjs'); if (typeof Doc2Json !== 'function') process.exit(1)"
          node --input-type=module -e "import { Doc2Json } from './dist/index.js'; if (typeof Doc2Json !== 'function') process.exit(1)"
      - run: npm pack --dry-run
